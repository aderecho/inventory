services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inventory-app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "
        composer install &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: inventory-mysql
    environment:
      MYSQL_DATABASE: up_inventory
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inventory-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  node:
    image: node:22
    container_name: inventory-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    environment:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    command: >
      sh -c "
        npm ci &&
        npm run dev -- --host 0.0.0.0
      "
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inventory-queue
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    command: >
      sh -c "
        php artisan queue:work --tries=3 --timeout=90 --sleep=3 --max-time=3600
      "
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inventory-reverb
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "
        composer install &&
        php artisan reverb:start --host=0.0.0.0 --port=8080
      "
    restart: unless-stopped

volumes:
  mysql_data: